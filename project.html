<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ★ 改這裡 1：瀏覽器分頁標題、Google 搜尋顯示的說明 -->
  <title>Project — Alvin Chan</title>
  <meta name="description" content="Project by Alvin Chan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ★ 改這裡 2：左上角的名字（四個頁面都要改） -->
  <a class="brand" href="index.html" aria-label="Alvin Chan, home">Alvin Chan</a>

  <!-- 電腦版右上角選單。目前所在頁面有 aria-current="page"，會自動顯示底線 -->
  <nav class="nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="work.html" aria-current="page">Work</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- 手機版：Menu 按鈕 + 全螢幕選單 -->
  <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  <div class="menu" id="menu" aria-hidden="true">
    <a href="index.html">Home</a>
    <a href="work.html" aria-current="page">Work</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <!-- ★ 改這裡 3：手機選單底部小字 -->
    <p class="menu-foot">Alvin Chan<br>Toronto</p>
  </div>

  <main class="page">
    <!-- 作品頁：內容全部由 script.js 的作品清單產生（標題、說明、每張圖與它的說明） -->
    <article class="section project" id="project">
      <div class="project-inner">
        <a class="back" href="work.html">&larr; Work</a>
        <header class="project-head">
          <div>
            <p class="project-meta" id="p-meta"></p>
            <h1 class="project-title" id="p-title"></h1>
          </div>
          <div>
            <div class="project-desc" id="p-desc"></div>
            <dl class="project-facts" id="p-facts"></dl>
          </div>
        </header>
        <div class="project-body" id="p-body"></div>
        <a class="back back-bottom" href="work.html">&larr; Back to work</a>
      </div>
    </article>
  </main>

  <!-- ★ 改這裡 4：頁尾名字與城市 -->
  <footer class="footer">© <span id="year"></span> Alvin Chan. Toronto.</footer>

  <!-- 點圖片後的放大檢視：單獨看一張圖（作品有多張圖時可用 ← → 切換） -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="lb-bar"><span class="lb-count" id="lb-count"></span><button type="button" id="lb-close" aria-label="Close">Close</button></div>
    <div class="lb-main">
      <button type="button" class="lb-arrow" id="lb-prev" aria-label="Previous image">&larr;</button>
      <div class="lb-stage" id="lb-stage"></div>
      <button type="button" class="lb-arrow" id="lb-next" aria-label="Next image">&rarr;</button>
    </div>
    <div class="lb-caption"><p id="lb-desc"></p></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
