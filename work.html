<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ★ 改這裡 1：瀏覽器分頁標題、Google 搜尋顯示的說明 -->
  <title>Work — Alvin Chan</title>
  <meta name="description" content="Selected work: character design, visual development, background, storyboard and animation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ★ 改這裡 2：左上角的名字（四個頁面都要改） -->
  <a class="brand" href="index.html" aria-label="Alvin Chan, home">Alvin Chan</a>

  <!-- 電腦版右上角選單。目前所在頁面有 aria-current="page"，會自動顯示底線 -->
  <nav class="nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="work.html" aria-current="page">Work</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- 手機版：Menu 按鈕 + 全螢幕選單 -->
  <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  <div class="menu" id="menu" aria-hidden="true">
    <a href="index.html">Home</a>
    <a href="work.html" aria-current="page">Work</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <!-- ★ 改這裡 3：手機選單底部小字 -->
    <p class="menu-foot">Alvin Chan<br>Toronto</p>
  </div>

  <main class="page">
    <!-- 作品總覽。分類選單在 script.js 的 CATEGORIES（★ 改這裡 B）；兩個重點作品是作品清單裡設了 spotlight: true 的項目。點縮圖會進入該作品自己的頁面（project.html） -->
    <section class="section" id="work">
      <h2 class="section-title">Work</h2>
      <div class="controls">
        <div class="filters" id="filters" role="tablist" aria-label="Filter works"></div>
      </div>
      <!-- 最上面兩個重點作品（spotlight: true） -->
      <div class="spot-grid" id="spot-grid"></div>
      <!-- 其他作品 -->
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <!-- ★ 改這裡 4：頁尾名字與城市 -->
  <footer class="footer">© <span id="year"></span> Alvin Chan. Toronto.</footer>

  <script src="script.js"></script>
</body>
</html>
